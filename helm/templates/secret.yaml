{{- if and .Values.github.token (not .Values.github.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omni.fullname" . }}-github
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omni.labels" . | nindent 4 }}
type: Opaque
stringData:
  GITHUB_TOKEN: {{ .Values.github.token | quote }}
{{- end }}
